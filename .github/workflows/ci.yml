name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests + conformance ratchet
    runs-on: ubuntu-latest
    steps:
      # The TypeScript test corpus the oracle reads is a git submodule
      # (microsoft/TypeScript), so it must be checked out. fetch-depth: 1 keeps
      # the (large) submodule clone shallow.
      - name: Checkout (with TypeScript corpus submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      # Pinned to the exact dev toolchain in build.zig.zon's minimum_zig_version.
      # Keep this in step with the toolchain used for development: std moves
      # under a dev pin, and CI that lags cannot see the breakage (the `zbc`
      # step below stopped compiling for exactly that reason).
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1824+7988f7952

      - name: Unit tests
        run: zig build test

      # The ratchet: fails if conformance regresses below oracle/baseline.lock
      # (match_min / wrong_max / prim_match_min / prim_wrong_max).
      - name: Conformance ratchet (oracle)
        run: zig build test-oracle

      # Static bug checker (memory-lifetime invariants: escape analysis,
      # use-after-free, double-free, leaks).
      - name: zbc
        run: zig build zbc
